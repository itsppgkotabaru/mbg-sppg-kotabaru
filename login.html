<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Admin • SPPG</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="admin/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script></head>
<body><div class="page"><header class="site-header"><div class="brand-mark">✺</div><div><div class="eyebrow">ADMINISTRATOR</div><h1>SPPG POLRES BREBES KOTABARU</h1><p>Login pengelola menu</p></div></header><main><section class="form-card login-card"><h2>🔐 Login Admin</h2><p>Gunakan email dan password akun Admin Supabase.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Masuk</button><p id="message" class="form-message"></p></form></section></main><footer><strong>SPPG POLRES BREBES KOTABARU</strong><span>Yayasan Kemala Bhayangkari</span></footer></div>
<script>const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("message");m.textContent="Memproses...";const{error}=await sb.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){m.textContent=error.message;return}location.href="admin/index.html"};</script></body></html>
